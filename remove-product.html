<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remove Products - Nile &amp; Bean Admin</title>
    <meta name="robots" content="noindex" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/admin.css" />

    <!-- Redirects anyone who is not a signed-in administrator. The server
         enforces this independently on every /api endpoint. -->
    <script src="js/api.js"></script>
    <script src="js/admin-guard.js"></script>
  </head>

  <body class="admin-body" data-product-mode="remove">
    <nav class="admin-navbar">
      <div class="logo">Nile &amp; Bean Admin</div>
      <ul>
        <li><a href="admin.html">Dashboard</a></li>
        <li><a href="index.html">Shop</a></li>
        <li><a href="logout.html">Sign out</a></li>
      </ul>
    </nav>

    <main class="admin-container">
      <h1>Remove Products</h1>
      <p class="admin-intro">Deleting is permanent. A product that appears in an existing order cannot be deleted - withdraw it from sale instead.</p>

      <p class="admin-status" id="productsStatus" hidden></p>

      <div class="table-scroll">
        <table class="admin-table" id="productTable">
          <thead>
            <tr>
            <th>Slug</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

    </main>

    <footer class="admin-footer">
      <p>&copy; <span id="currentYear">2025</span> Nile &amp; Bean. All rights reserved.</p>
    </footer>

    <script src="js/admin.js"></script>
    <script>
      document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
