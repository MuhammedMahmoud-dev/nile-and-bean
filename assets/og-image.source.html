<!DOCTYPE html>
<!--
  Source for assets/og-image.png (1200x630): the shop board from the home page,
  drawn with the site's own tokens and self-hosted fonts. Regenerate with:
    playwright screenshot --viewport-size=1200,630 --wait-for-timeout=1500 assets/og-image.source.html assets/og-image.png
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../css/fonts.css" />
<style>
  :root {
    --plaster: #dcebe5; --plaster-deep: #c9ded5; --enamel: #1c3f94; --white: #fbfbf8;
    --red: #c8281e; --red-deep: #9e1d15; --saffron: #f2b518; --saffron-deep: #c98f00; --ink-soft: #3b4a63;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: linear-gradient(var(--plaster) 70%, var(--plaster-deep) 70%);
    font-family: 'Readex Pro', sans-serif;
    display: grid; place-items: center;
  }
  .hang { position: relative; padding-top: 70px; }
  .chain { position: absolute; top: 0; width: 18px; height: 74px; color: var(--ink-soft); }
  .chain--l { left: 18%; } .chain--r { right: 18%; }
  .hook { position: absolute; top: -4px; width: 28px; height: 12px; border-radius: 3px; background: var(--ink-soft); }
  .hook--l { left: calc(18% - 5px); } .hook--r { right: calc(18% - 5px); }
  .board {
    position: relative; width: 960px; text-align: center; overflow: hidden;
    padding: 46px 60px 0; border-radius: 16px; background: var(--enamel);
    background-image: linear-gradient(170deg, rgba(255,255,255,.16), rgba(255,255,255,0) 38%);
    box-shadow: inset 0 0 0 12px var(--enamel), inset 0 0 0 17px var(--white),
                0 30px 50px -20px rgba(11,26,61,.55);
  }
  .ar {
    display: block; font-family: 'Aref Ruqaa', serif; font-weight: 700;
    font-size: 150px; line-height: 1.12; color: var(--white);
    text-shadow: 5px 7px 0 var(--saffron-deep);
  }
  .en {
    display: block; margin-top: 4px; font-family: 'Bungee', sans-serif; font-size: 70px;
    letter-spacing: .04em; color: var(--saffron); text-shadow: 4px 4px 0 var(--red-deep);
  }
  .strip {
    margin: 34px -60px 0; padding: 16px 30px 20px; background: var(--red);
    border-top: 5px solid var(--white); color: var(--white);
    font-weight: 600; font-size: 24px; letter-spacing: .08em; text-transform: uppercase;
    display: flex; justify-content: center; gap: 30px; align-items: baseline;
  }
  .strip span[lang] { font-family: 'Aref Ruqaa', serif; font-weight: 700; font-size: 30px; letter-spacing: 0; text-transform: none; }
</style>
</head>
<body>
  <div class="hang">
    <span class="hook hook--l"></span><span class="hook hook--r"></span>
    <svg class="chain chain--l" viewBox="0 0 14 58"><g fill="none" stroke="currentColor" stroke-width="1.8">
      <ellipse cx="7" cy="4" rx="3.4" ry="4.6"/><ellipse cx="7" cy="11.6" rx="3.4" ry="4.6"/><ellipse cx="7" cy="19.2" rx="3.4" ry="4.6"/><ellipse cx="7" cy="26.8" rx="3.4" ry="4.6"/><ellipse cx="7" cy="34.4" rx="3.4" ry="4.6"/><ellipse cx="7" cy="42" rx="3.4" ry="4.6"/><ellipse cx="7" cy="49.6" rx="3.4" ry="4.6"/></g></svg>
    <svg class="chain chain--r" viewBox="0 0 14 58"><g fill="none" stroke="currentColor" stroke-width="1.8">
      <ellipse cx="7" cy="4" rx="3.4" ry="4.6"/><ellipse cx="7" cy="11.6" rx="3.4" ry="4.6"/><ellipse cx="7" cy="19.2" rx="3.4" ry="4.6"/><ellipse cx="7" cy="26.8" rx="3.4" ry="4.6"/><ellipse cx="7" cy="34.4" rx="3.4" ry="4.6"/><ellipse cx="7" cy="42" rx="3.4" ry="4.6"/><ellipse cx="7" cy="49.6" rx="3.4" ry="4.6"/></g></svg>
    <div class="board">
      <span class="ar" lang="ar" dir="rtl">النيل والبُن</span>
      <span class="en">NILE &amp; BEAN</span>
      <div class="strip">
        <span>Coffee</span><span lang="ar" dir="rtl">قهوة</span>
        <span>Tea</span><span lang="ar" dir="rtl">شاي</span>
        <span>Sahlab</span><span lang="ar" dir="rtl">سحلب</span>
      </div>
    </div>
  </div>
</body>
</html>
