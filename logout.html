<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signing Out - Nile &amp; Bean</title>
    <meta name="robots" content="noindex" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
  </head>

  <body>
    <div id="root">
      <main>
        <section class="coffee-section">
          <div class="coffee-container text-center">
            <h1>Signing you out</h1>
            <p id="logoutMessage" role="status">One moment...</p>
            <p><a href="index.html" class="button">Back to the shop</a></p>
          </div>
        </section>
      </main>
    </div>

    <script src="js/api.js"></script>
    <script>
      // The token is stateless, so signing out means discarding it here. There
      // is nothing to revoke server-side. The cart is deliberately left alone:
      // it belongs to the browser, not the account.
      (function () {
        window.NileBeanAPI.logout();
        document.getElementById('logoutMessage').textContent =
          'You are signed out. Returning to the shop...';
        setTimeout(function () {
          window.location.replace('index.html');
        }, 1200);
      })();
    </script>
  </body>
</html>
