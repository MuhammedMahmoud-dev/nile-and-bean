<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product - Nile &amp; Bean Admin</title>
    <meta name="robots" content="noindex" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/admin.css" />

    <!-- Redirects anyone who is not a signed-in administrator. The server
         enforces this independently on every /api endpoint. -->
    <script src="js/api.js"></script>
    <script src="js/admin-guard.js"></script>
  </head>

  <body class="admin-body" data-product-mode="list">
    <nav class="admin-navbar">
      <div class="logo">Nile &amp; Bean Admin</div>
      <ul>
        <li><a href="admin.html">Dashboard</a></li>
        <li><a href="index.html">Shop</a></li>
        <li><a href="logout.html">Sign out</a></li>
      </ul>
    </nav>

    <main class="admin-container">
      <h1>Add a Product</h1>
      <p class="admin-intro">New products appear on the menu immediately.</p>

      <p class="admin-status" id="productsStatus" hidden></p>

      <div class="table-scroll">
        <table class="admin-table" id="productTable">
          <thead>
            <tr>
            <th>Slug</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <form class="admin-form" id="productForm" novalidate>
        <h2 id="productFormTitle">Add New Product</h2>
        <input type="hidden" id="productDbId" value="">

        <div class="form-row">
          <div class="form-field">
            <label for="productSlug">URL slug</label>
            <input type="text" id="productSlug" name="slug" required
                   placeholder="flat-white" pattern="[a-z0-9-]+">
            <span class="field-error" id="productSlugError"></span>
          </div>
          <div class="form-field">
            <label for="productName">Name</label>
            <input type="text" id="productName" name="name" required maxlength="120"
                   placeholder="Flat White">
            <span class="field-error" id="productNameError"></span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="productPrice">Price ($)</label>
            <input type="number" id="productPrice" name="price" required
                   min="0.01" step="0.01" placeholder="4.29">
            <span class="field-error" id="productPriceError"></span>
          </div>
          <div class="form-field">
            <label for="productCategory">Category</label>
            <select id="productCategory" name="category" required>
              <option value="">Select a category</option>
              <option value="coffee">Coffee</option>
              <option value="tea">Tea</option>
              <option value="pastry">Pastry</option>
              <option value="seasonal">Seasonal</option>
            </select>
            <span class="field-error" id="productCategoryError"></span>
          </div>
        </div>

        <div class="form-field">
          <label for="productDescription">Short description</label>
          <input type="text" id="productDescription" name="short_description" maxlength="300"
                 placeholder="Smooth espresso with velvety steamed milk">
          <span class="field-error" id="productDescriptionError"></span>
        </div>

        <div class="form-field">
          <label for="productImage">Image URL <span class="optional">(optional)</span></label>
          <input type="url" id="productImage" name="image" maxlength="500"
                 placeholder="https://images.unsplash.com/...">
          <span class="field-error" id="productImageError"></span>
        </div>

        <div class="actions">
          <button type="submit" id="productSubmit">Add Product</button>
          <button type="button" id="productCancel" hidden>Cancel</button>
        </div>
      </form>

    </main>

    <footer class="admin-footer">
      <p>&copy; <span id="currentYear">2025</span> Nile &amp; Bean. All rights reserved.</p>
    </footer>

    <script src="js/admin.js"></script>
    <script>
      document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
